name: CI Build & Test

on: 
  push: 
    branches: ["mainline", "develop"]
  pull_request:
    branches: ["mainline", "develop"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        java: [11, 17, 21]

    steps:
      - name: Checkout source
        uses: actions/checkout@v6.1.0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{matrix.java}}
          cache: maven

      - name: Build & Test
        run: mvn -B clean verify
